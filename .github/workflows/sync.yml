name: Atualizar Portal PNCP
on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *'
permissions:
  contents: write
concurrency:
  group: pncp-data
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Sincronizar novos processos (limitado)
        run: python scripts/sync.py
      - name: Gerar índice e páginas
        run: python scripts/build.py
      - name: Consultar anexos (limitado)
        run: python scripts/anexos.py
      - name: Registrar arquivos atualizados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dados.json data/
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar dados do portal PNCP'
            git pull --rebase
            git push
          fi
